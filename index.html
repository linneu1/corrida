<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grande Corrida da Turma 🐎</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #111827;
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    #game-container {
      position: relative;
      border: 4px solid #f59e0b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
      background: #000;
      max-width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .panel {
      margin-top: 12px;
      background: #1f2937;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #374151;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }
    .wallet {
      font-size: 16px;
      font-weight: bold;
      color: #10b981;
      background: #064e3b;
      padding: 6px 12px;
      border-radius: 6px;
    }
    label {
      font-size: 13px;
      color: #d1d5db;
    }
    select, input {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    button {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover {
      background: #d97706;
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <h1>🏇 Grande Corrida da Turma!</h1>

  <div id="game-container">
    <canvas id="raceCanvas" width="800" height="420"></canvas>
  </div>

  <div class="panel">
    <div class="wallet">💰 Saldo: R$ <span id="balance">100</span></div>

    <div>
      <label for="runnerSelect">Corredor:</label>
      <select id="runnerSelect">
        <option value="Agatha">Agatha</option>
        <option value="Frederico">Frederico</option>
        <option value="Yasmin">Yasmin</option>
        <option value="Maria">Maria</option>
        <option value="Kauê">Kauê</option>
        <option value="Gregório">Gregório</option>
      </select>
    </div>

    <div>
      <label for="betAmount">Aposta:</label>
      <input type="number" id="betAmount" value="20" min="10" max="100" step="10" style="width: 70px;">
    </div>

    <button id="startBtn" onclick="startRace()">Iniciar Corrida!</button>
  </div>

  <script>
    const canvas = document.getElementById("raceCanvas");
    const ctx = canvas.getContext("2d");

    // Grupos do Easter Egg Secreto
    const groupPink = ["Agatha", "Yasmin", "Maria"];
    const groupBlue = ["Kauê", "Gregório", "Frederico"];

    const runnersData = [
      { name: "Agatha", color: "#ec4899", jersey: "#f472b6" },
      { name: "Frederico", color: "#3b82f6", jersey: "#60a5fa" },
      { name: "Yasmin", color: "#a855f7", jersey: "#c084fc" },
      { name: "Maria", color: "#f43f5e", jersey: "#fb7185" },
      { name: "Kauê", color: "#10b981", jersey: "#34d399" },
      { name: "Gregório", color: "#eab308", jersey: "#fde047" }
    ];

    let balance = 100;
    let isRacing = false;
    let raceFinished = false;
    let skyColorType = "pink";
    let winner = null;
    let selectedRunner = "";
    let betValue = 20;
    let resultMessage = "";

    let runners = [];

    function resetRace() {
      skyColorType = Math.random() < 0.5 ? "pink" : "blue";
      const pool = skyColorType === "pink" ? groupPink : groupBlue;
      winner = pool[Math.floor(Math.random() * pool.length)];

      runners = runnersData.map((r, index) => {
        return {
          ...r,
          x: 50,
          y: 110 + index * 48,
          legAngle: 0,
          isWinner: r.name === winner
        };
      });

      raceFinished = false;
      resultMessage = "";
    }

    function drawScene() {
      // Desenhar Céu
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 90);
      if (skyColorType === "pink") {
        skyGrad.addColorStop(0, "#f472b6");
        skyGrad.addColorStop(1, "#fbcfe8");
      } else {
        skyGrad.addColorStop(0, "#38bdf8");
        skyGrad.addColorStop(1, "#bae6fd");
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, 90);

      // Nuvens
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(120, 45, 25, 0, Math.PI * 2);
      ctx.arc(140, 45, 20, 0, Math.PI * 2);
      ctx.arc(650, 35, 30, 0, Math.PI * 2);
      ctx.fill();

      // Grama e Pista
      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 90, canvas.width, 10);

      ctx.fillStyle = "#854d0e";
      ctx.fillRect(0, 100, canvas.width, 320);

      // Linhas da Pista
      ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
      ctx.lineWidth = 2;
      for (let i = 0; i <= 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 100 + i * 48);
        ctx.lineTo(canvas.width, 100 + i * 48);
        ctx.stroke();
      }

      // Linha de Chegada
      const finishX = 720;
      ctx.fillStyle = "#ffffff";
      for (let y = 100; y < 380; y += 20) {
        ctx.fillRect(finishX, y, 10, 10);
        ctx.fillRect(finishX + 10, y + 10, 10, 10);
      }

      // Desenhar Corredores
      runners.forEach((r) => {
        drawHorseAndRider(r);
      });

      // Painel do Resultado (na própria tela)
      if (raceFinished) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(100, 120, 600, 180);
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 3;
        ctx.strokeRect(100, 120, 600, 180);

        ctx.fillStyle = selectedRunner === winner ? "#4ade80" : "#f87171";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(selectedRunner === winner ? "🎉 VOCÊ GANHOU!" : "❌ NÃO FOI DESTA VEZ!", 400, 170);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Vencedor da corrida: ${winner}!`, 400, 210);
        ctx.fillText(resultMessage, 400, 250);

        ctx.textAlign = "left";
      }
    }

    function drawHorseAndRider(r) {
      ctx.save();
      ctx.translate(r.x, r.y);

      const legOffset = Math.sin(r.legAngle) * 8;

      // Corpo
      ctx.fillStyle = "#78350f";
      ctx.beginPath();
      ctx.ellipse(20, 15, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cabeça
      ctx.beginPath();
      ctx.ellipse(36, 5, 8, 5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // Pernas
      ctx.strokeStyle = "#451a03";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(30, 20); ctx.lineTo(32 + legOffset, 32);
      ctx.moveTo(26, 20); ctx.lineTo(24 - legOffset, 32);
      ctx.moveTo(10, 20); ctx.lineTo(12 - legOffset, 32);
      ctx.moveTo(14, 20); ctx.lineTo(12 + legOffset, 32);
      ctx.stroke();

      // Aluno
      ctx.fillStyle = r.jersey;
      ctx.fillRect(14, -2, 10, 12);

      ctx.fillStyle = "#fde047";
      ctx.beginPath();
      ctx.arc(19, -6, 6, 0, Math.PI * 2);
      ctx.fill();

      // Nome
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px sans-serif";
      ctx.shadowColor = "black";
      ctx.shadowBlur = 4;
      ctx.fillText(r.name, -10, -14);

      ctx.restore();
    }

    function update() {
      if (!isRacing) return;

      let winnerReached = false;

      runners.forEach((r) => {
        let speedBoost = Math.random() * 2.5;

        // Bônus para o vencedor para manter a lógica do Easter Egg
        if (r.isWinner && r.x > 350) {
          speedBoost += 0.7;
        }

        r.x += 1.2 + speedBoost;

        // Travar na linha de chegada para não sair da tela
        if (r.x > 710) {
          r.x = 710;
        }

        r.legAngle += 0.3;

        if (r.x >= 710) {
          winnerReached = true;
        }
      });

      if (winnerReached) {
        isRacing = false;
        raceFinished = true;
        document.getElementById("startBtn").disabled = false;

        if (selectedRunner === winner) {
          const prize = betValue * 3;
          balance += prize;
          resultMessage = `Você apostou R$ ${betValue} e recebeu R$ ${prize}!`;
        } else {
          resultMessage = `Você apostou R$ ${betValue} em ${selectedRunner}. Tente novamente!`;
        }

        document.getElementById("balance").innerText = balance;
      }
    }

    function startRace() {
      const select = document.getElementById("runnerSelect");
      const betInput = document.getElementById("betAmount");

      selectedRunner = select.value;
      betValue = parseInt(betInput.value) || 20;

      if (betValue > balance) {
        alert("Você não tem saldo suficiente para esta aposta!");
        return;
      }

      balance -= betValue;
      document.getElementById("balance").innerText = balance;

      isRacing = true;
      document.getElementById("startBtn").disabled = true;

      resetRace();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      update();
      drawScene();
      requestAnimationFrame(gameLoop);
    }

    resetRace();
    gameLoop();
  </script>
</body>
</html>
